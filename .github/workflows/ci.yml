name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -o "iPhone [^(]*" | sed 's/ *$//')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Malmungchi.xcodeproj \
            -scheme Malmungchi \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log
